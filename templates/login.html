<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background: linear-gradient(
                135deg,
                #ff6ec4,
                #7873f5,
                #42e695,
                #ffb347
            );

            background-size:400% 400%;
            animation:bgMove 10s ease infinite;
        }

        @keyframes bgMove{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .login-box{
            width:420px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(15px);
            padding:35px;
            border-radius:25px;
            color:white;
            box-shadow:0 8px 32px rgba(0,0,0,0.2);
        }

        .title{
            text-align:center;
            margin-bottom:25px;
            font-size:32px;
            font-weight:600;
        }

        .form-control,
        .form-control:focus{
            background:rgba(255,255,255,0.2);
            border:none;
            color:white;
            box-shadow:none;
        }

        .form-control::placeholder{
            color:#eee;
        }

        .btn-login{
            width:100%;
            padding:12px;
            border:none;
            border-radius:12px;
            background:white;
            color:#333;
            font-weight:600;
            transition:0.3s;
        }

        .btn-login:hover{
            transform:scale(1.03);
            background:#f1f1f1;
        }

        .register-link{
            text-align:center;
            margin-top:15px;
        }

        .register-link a{
            color:white;
            text-decoration:none;
            font-weight:600;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1 class="title">
        Welcome Back ✨
    </h1>

    <form action="/dashboard" method="GET">

        <div class="mb-3">

            <label>Email</label>

            <input type="email"
                   class="form-control"
                   placeholder="Enter email"
                   required>

        </div>

        <div class="mb-4">

            <label>Password</label>

            <input type="password"
                   class="form-control"
                   placeholder="Enter password"
                   required>

        </div>

        <button type="submit" class="btn-login">
            Login 🚀
        </button>

    </form>

    <div class="register-link">
        New User?
        <a href="/">Register Here</a>
    </div>

</div>

</body>

</html>
